<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found &mdash; nottoolate.us</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/index.css" />
  <style>
    .not-found {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    .not-found h1 {
      font-size: clamp(5rem, 20vw, 12rem);
      line-height: 1;
      letter-spacing: -.1em;
      margin: 0 0 .5rem;
      color: var(--accent);
    }
    .not-found h2 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin: 0 0 1rem;
    }
    .not-found p {
      color: var(--muted);
      max-width: 40rem;
      margin: 0 auto 2rem;
    }
    .not-found a {
      margin: 0;
    }
  </style>
</head>
<body>
<main>
  <div class="not-found">
    <h1>404</h1>
    <h2>Page not found.</h2>
    <p>That URL doesn&rsquo;t exist here. Head back to the homepage and find what you were looking for.</p>
    <a href="/">Back to nottoolate.us</a>
  </div>
</main>
</body>
</html>
